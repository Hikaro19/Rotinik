<div
  class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
  (click)="fecharModal()"
>
  <div
    class="bg-[#13111b] border border-purple-500/30 rounded-2xl p-6 w-full max-w-md shadow-[0_0_15px_rgba(139,92,246,0.15)] relative"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()"
  >
    <button
      type="button"
      class="absolute top-4 right-4 text-gray-400 transition-colors hover:text-white"
      aria-label="Fechar modal"
      [disabled]="loading"
      (click)="fecharModal()"
    >
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>

    <div class="pr-10">
      <p class="mb-2 text-xs font-semibold uppercase tracking-[0.16em] text-purple-300">
        Acao destrutiva
      </p>
      <h2 class="mb-3 text-2xl font-bold text-white">{{ title }}</h2>
      <p class="text-sm leading-6 text-slate-300">{{ message }}</p>
    </div>

    <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="px-4 py-3 text-sm font-semibold text-[#a78bfa] transition-colors hover:text-white"
        [disabled]="loading"
        (click)="fecharModal()"
      >
        {{ cancelLabel }}
      </button>
      <button
        type="button"
        class="inline-flex min-h-12 items-center justify-center rounded-full bg-red-500 px-6 py-3 text-sm font-semibold text-white shadow-[0_0_18px_rgba(239,68,68,0.28)] transition-colors hover:bg-red-400 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="loading"
        (click)="confirm()"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
