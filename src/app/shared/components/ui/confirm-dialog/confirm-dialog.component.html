<div class="dialog-overlay" (click)="fecharModal()">
  <div class="dialog-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    
    <button
      type="button"
      class="dialog-close"
      aria-label="Fechar modal"
      [disabled]="loading"
      (click)="fecharModal()"
    >
      &times;
    </button>

    <div class="dialog-content">
      <p class="dialog-kicker" *ngIf="kicker">{{ kicker }}</p>
      <h2 class="dialog-title">{{ title }}</h2>
      <p class="dialog-message">{{ message }}</p>
    </div>

    <div class="dialog-actions">
      <button
        *ngIf="showCancelButton"
        type="button"
        class="dialog-cancel"
        [disabled]="loading"
        (click)="fecharModal()"
      >
        {{ cancelLabel }}
      </button>
      <app-button
        [variant]="isDestructive ? 'danger' : 'primary'"
        size="md"
        [loading]="loading"
        (buttonClick)="confirm()"
      >
        {{ confirmLabel }}
      </app-button>
    </div>

  </div>
</div>
