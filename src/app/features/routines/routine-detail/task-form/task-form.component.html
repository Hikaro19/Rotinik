<app-modal [title]="isEditMode ? 'Atualizar Dados' : 'Criar Tarefa'"
  [subtitle]="isEditMode ? 'Refino Tático' : 'Nova Missão'"
  description="Defina os parâmetros da tarefa. O XP e a recompensa serão calculados automaticamente pelo sistema."
  [submitting]="submitting" (close)="fecharModal()">

  <form class="modal-form" [formGroup]="taskForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Título da Tarefa</label>
      <input type="text" formControlName="title" placeholder="Ex: Treino de pernas completo" />
    </div>

    <div class="form-group">
      <label>Descrição (Contexto)</label>
      <textarea rows="3" formControlName="description"></textarea>
    </div>

    <div class="form-group">
      <label>Nível de Importância</label>
      <div class="pills-container">
        <button *ngFor="let option of importanceOptions" type="button" [class]="getImportanceClass(option.value)"
          (click)="taskForm.controls.importance.setValue(option.value)">
          <span class="dot"></span><span>{{ option.label }}</span>
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Tempo de Conclusão</label>
      <div class="input-with-suffix">
        <input type="number" min="5" step="5" formControlName="estimatedMinutes" />
        <span class="suffix">minutos</span>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" [disabled]="submitting" (click)="fecharModal()">Cancelar</button>
      <button type="submit" class="btn-submit" [disabled]="submitting">{{ isEditMode ? 'Salvar' : 'Criar Missão'
        }}</button>
    </div>
  </form>
</app-modal>
