<div class="achievements-showcase">
  <div class="showcase-header">
    <h3>Vitrine de Conquistas</h3>
    <button class="edit-showcase-btn" (click)="openModal()">Editar Vitrine</button>
  </div>

  <div class="achievements-grid">
    <!-- Equipped Medals -->
    <div class="achievement-card equipped" *ngFor="let um of equippedMedals">
      <div class="card-inner unlocked" data-rarity="common">
        <div class="achievement-badge">
          <span class="badge-icon">{{ um.medal.iconUrl }}</span>
        </div>
        <div class="achievement-content">
          <h3 class="achievement-name">{{ um.medal.name }}</h3>
          <p class="achievement-description">{{ um.medal.description }}</p>
        </div>
      </div>
    </div>

    <!-- Empty Slots -->
    <div class="achievement-card empty-slot" *ngFor="let slot of emptySlots" (click)="openModal()">
      <div class="card-inner empty">
        <div class="add-icon">+</div>
        <p>Equipar</p>
      </div>
    </div>
  </div>
</div>

<app-achievements-modal
  *ngIf="showModal()"
  [allMedals]="allMedals()"
  [myMedals]="myMedals()"
  [isPremium]="isPremium()"
  (close)="closeModal()"
  (save)="saveEquippedMedals($event)"
></app-achievements-modal>
